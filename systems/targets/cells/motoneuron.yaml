# Functional properties of motoneurons derived from mouse embryonic stem cells
# https://www.jneurosci.org/content/jneuro/24/36/7848.full.pdf
Celltype: Motoneuron
Template: livn.models.rcsd.neuron.templates.BRK.BRK
Numerics:
    adaptive: False
    use_coreneuron: True
    t0: 0
    tstop: 2000
    dt: 0.0125
    record_dt: 0.01
    v_init: -60.0
Record:
    soma: ['V']
    dend: ['V']
# Behaviour under the network's OU conductance drive, not the current clamp.
# Without this fits tend to produce cells that fit the clamp targets and
# then lock (one spike, any drive) or invert (rate falling as drive rises)
# in the network. Levels span the range noise-g_e0 is searched over.
Drive:
    enabled: True
    # Bracket the peak. Measured with the shipped parameters, rate against
    # g_e0 peaks at 0.03-0.3 and falls away past it as the background clamps
    # the cell toward depolarisation block (median soma V runs -62 mV at 0.01
    # to -18 mV at 3.0). The old [0.3 .. 6.0] window sampled the falling limb
    # only, so nothing in the fit could see where the cell works best.
    levels: [0.01, 0.03, 0.1, 0.3]
    duration: 2000.0
    seed: 20260811
    min_spikes: 5.0
    # The top level is 3x past the peak, so this asks the cell to stay usable
    # when the background overshoots rather than to be flat. At 0.5 with the
    # old window it was asking a cell not to block under a conductance ~750x
    # its leak, which no point on the front satisfied.
    min_top_fraction: 0.2
    std_fraction: 0.33
    # The correlation time the systems were fitted at (EI1 33.0 / 28.5). The
    # default this used to run at, 2.728 ms, drives the same cell 2-17x harder
    # at the same mean.
    tau_e: 33.0
    tau_i: 28.5
    # Realisations averaged per level.
    repeats: 3
Targets:
    Rin:    
        I: [-100.0]
        I_factor: 1.0e-3
        upper: [598.0]
        lower: [540.0]
        t: [250, 1250]
    tau0:    
        I: [-0.1]
        upper: [19.375]
        lower: [16.308]
        t: [250, 1250]
    threshold: -37.0
    V_hold:
        val: -60
        I : 0 
    V_rest:
        val: -57.4
        I : 0 
    f_I:
        I: [20, 30, 40, 50, 60, 70, 80]
        I_factor: 1.0e-3
        mean: [3.88, 9.09, 11.75, 14.29, 15.96, 16.58, 18.25]
        t: [500, 1500]
    spike_amp:
        upper: [80.0, 80.0, 80.0, 80.0, 80.0, 80.0, 80.0]
        lower: [60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0]
    spike_adaptation:
        upper: [1.6, 1.6, 1.6, 1.6, 1.6, 1.6, 1.6]
        lower: [1.2, 1.2, 1.2, 1.2, 1.2, 1.2, 1.2]
        t: [500, 1500]
Parameters:
  e_pas: -62
  pp: 0.1
  Ltotal: 120.0
  Ra: 190.0
Space:
  global_diam:   [2.0, 15.0]
  global_cm:     [0.9, 2.5]
  soma_f_Caconc:     [1.0e-3, 2.0e-2]
  soma_alpha_Caconc: [0.2, 5.0]
  soma_kCa_Caconc:   [1.0, 30.0]
  dend_f_Caconc:     [1.0e-3, 2.0e-2]
  dend_alpha_Caconc: [0.2, 5.0]
  dend_kCa_Caconc:   [1.0, 30.0]
  soma_gmax_Na:  [0.1, 0.3]
  soma_gmax_K:  [0.01, 0.3]
  soma_gmax_KCa:  [0.0001, 0.01]
  soma_gmax_CaN:  [0.00001, 0.03]
  soma_g_pas:  [0.00001, 0.01]
  dend_gmax_CaL:  [0.00001, 0.001]
  dend_gmax_CaN:  [0.00001, 0.001]
  dend_gmax_KCa:  [0.0001, 0.005]
  dend_g_pas:  [0.00001, 0.01]
  cm_ratio: [1.0, 40.0]
