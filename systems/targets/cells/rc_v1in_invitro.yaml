# Renshaw cell -- ES-cell-derived / in-vitro phenotype
Celltype: RenshawCell
Template: livn.models.rcsd.neuron.templates.V1In.V1In
Population: INH
Retired: True
Numerics:
  tstop: 2000
  dt: 0.0125
  record_dt: 0.01
Drive:
    enabled: True
    # Bracket the peak. These levels were carried over from the motoneuron
    # config and are too high for this cell: across a whole 1900-evaluation
    # front, all 130 solutions failed `drive_no_inversion` -- the rate at the
    # top level had already fallen past the peak, by 12 to 66 spikes. The same
    # levels are fine for the Perry cell, which comes out around 15 um; these
    # solutions run to ~24 um, and the larger area takes more background
    # conductance at the same g_e0, so saturation arrives sooner. Shifted down
    # one decade to put the peak inside the window rather than at its edge.
    levels: [0.003, 0.01, 0.03, 0.1]
    duration: 2000.0
    seed: 20260811
    min_spikes: 5.0
    # The top level is 3x past the peak, so this asks the cell to stay usable
    # when the background overshoots rather than to be flat. At 0.5 with the
    # old window it was asking a cell not to block under a conductance ~750x
    # its leak, which no point on the front satisfied.
    min_top_fraction: 0.2
    std_fraction: 0.33
    # The correlation time the systems were fitted at (EI1 33.0 / 28.5). The
    # default this used to run at, 2.728 ms, drives the same cell 2-17x harder
    # at the same mean.
    tau_e: 33.0
    tau_i: 28.5
    # Realisations averaged per level.
    repeats: 3
Targets:
  Rin:
    # Hoang 2018 ES-derived RC: 421.7 +/- 30.1 MOhm
    I: [-50.0]
    I_factor: 1.0e-3
    upper: [480.0]
    lower: [360.0]
    t: [250, 1250]
  tau0:
    # estimate (Hoang notes RC time constant is "increased" vs non-RC; no value)
    I: [-0.01]
    upper: [22.0]
    lower: [10.0]
    t: [250, 1250]
  threshold: -50.0    # Motoneuron-Modeling estimate
  V_hold:
    val: -60.0
  V_rest:
    val: -60.0
  f_I:
    # Motoneuron-Modeling estimate (no ES-derived V1 f-I data); held at v_hold (-60),
    # i.e. no separate f_I.V_hold -> defaults to V_hold.
    # +/-30% tolerance bands
    I: [15, 20, 30, 40, 50, 60, 70]
    I_factor: 1.0e-3
    mean:  [4.0, 10.0, 20.0, 30.0, 38.0, 44.0, 48.0]
    lower: [3.0,  7.0, 14.0, 21.0, 27.0, 31.0, 34.0]
    upper: [5.0, 13.0, 26.0, 39.0, 49.0, 57.0, 62.0]
    t: [500, 1500]
    # steady-state, as the motoneuron and Perry targets are.
    steady_ms: 500
  spike_amp:
    upper: [75.0, 75.0, 75.0, 75.0, 75.0, 75.0, 75.0]
    lower: [55.0, 55.0, 55.0, 55.0, 55.0, 55.0, 55.0]
  spike_adaptation:
    upper: [1.25, 1.25, 1.25, 1.25, 1.25, 1.25, 1.25]
    lower: [0.85, 0.85, 0.85, 0.85, 0.85, 0.85, 0.85]
    t: [500, 1500]

# All biophysical parameters are searched (nothing fixed). cm and e_pas are kept
# to physiologically narrow ranges; the rest span their plausible ranges.
Parameters: {}

Space:
  # geometry / passive
  global_diam:   [15.0, 45.0]
  global_cm:     [0.9, 1.1]
  e_pas:         [-75.0, -65.0]
  soma_g_pas:    [3.0e-5, 2.0e-4]
  # active conductances
  soma_gmax_Na:  [0.05, 0.30]
  soma_gmax_K:   [0.02, 0.15]
  soma_gmax_Ka:  [0.0, 0.1]
  soma_gmax_KCa: [1.0e-5, 3.0e-3]
  soma_gmax_CaN: [0.0, 0.02]
  soma_f_Caconc:     [1.0e-3, 2.0e-2]
  soma_alpha_Caconc: [0.2, 5.0]
  soma_kCa_Caconc:   [1.0, 30.0]
