[project]
name = "systems"
version = "0.1.0"
description = "Code to generate livn systems"
authors = [
    { name = "Frithjof Gressmann", email = "fg14@illinois.edu" },
    { name = "Ivan Raikov", email = "ivan.g.raikov@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dmosopt @ git+https://github.com/iraikov/dmosopt.git@299bd79",
    "machinable @ git+https://github.com/machinable-org/machinable.git@98c6b54",
    "sqlean-py>=3.47.0",
    "livn[neuron]",
    "pandas>=2.3.1",
    "keras==3.13.0",
    "huggingface-hub>=0.3.1",
]

[tool.uv.sources]
livn = { workspace = true }

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "systems",
    "systems.datasets",
    "systems.interface",
    "systems.interface.remotes",
    "systems.targets",
    "systems.targets.cells",
]
package-dir = { systems = "." }
