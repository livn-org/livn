[project]
name = "systems"
version = "0.1.0"
description = "Code to generate livn systems"
authors = [
    { name = "Frithjof Gressmann", email = "fg14@illinois.edu" },
    { name = "Ivan Raikov", email = "ivan.g.raikov@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dmosopt @ git+https://github.com/iraikov/dmosopt.git@1de66e1",
    "machinable @ git+https://github.com/machinable-org/machinable.git@b399212",
    "sqlean-py>=3.47.0",
    "livn",
    "mpi4py>=4.0.0",
    "neuron>=9.0.0",
    "neuroh5",
    "pandas>=2.3.1",
    "keras==3.13.0",
    "huggingface-hub>=0.3.1",
]

[tool.uv.sources]
livn = { workspace = true }
neuroh5 = { git = "https://github.com/iraikov/neuroh5.git", rev = "ae0c4b3" }

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "systems",
    "systems.datasets",
    "systems.interface",
    "systems.interface.remotes",
    "systems.targets",
    "systems.targets.cells",
]
package-dir = { systems = "." }
