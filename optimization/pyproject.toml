[project]
name = "optimization"
version = "0.1.0"
description = "Differentiable losses, metrics, and fitting for livn models"
authors = [
    { name = "Frithjof Gressmann", email = "fg14@illinois.edu" },
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["livn[diffrax]"]

[tool.uv.sources]
livn = { workspace = true }

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["optimization"]
package-dir = { optimization = "." }
