name: CI

on:
  workflow_dispatch: # manual
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

env:
  UV_CACHE_DIR: /tmp/.uv-cache
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv run --frozen --only-group dev ruff format --check
      - run: uv run --frozen --only-group dev ruff check

  download-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache the test system
        id: cache-system
        uses: actions/cache@v5
        with:
          path: systems/graphs/EI
          key: ei-system-v1

      - name: Install minimal dependencies
        if: steps.cache-system.outputs.cache-hit != 'true'
        run: uv sync --group dev

      - name: Download the test system
        if: steps.cache-system.outputs.cache-hit != 'true'
        run: uv run tests/cli download-system

  test-default:
    runs-on: ubuntu-latest
    needs: [lint, download-system]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Restore the test system
        uses: actions/cache/restore@v5
        with:
          path: systems/graphs/EI
          key: ei-system-v1
          fail-on-cache-miss: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run tests/cli test --backend none

  test-diffrax:
    runs-on: ubuntu-latest
    needs: [lint, download-system]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Restore the test system
        uses: actions/cache/restore@v5
        with:
          path: systems/graphs/EI
          key: ei-system-v1
          fail-on-cache-miss: true

      - name: Install dependencies
        run: uv sync --group dev --extra diffrax

      - name: Run tests
        run: uv run tests/cli test --backend diffrax

  test-neuron:
    runs-on: ubuntu-latest
    needs: [lint, download-system]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Restore the test system
        uses: actions/cache/restore@v5
        with:
          path: systems/graphs/EI
          key: ei-system-v1
          fail-on-cache-miss: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake openmpi-bin libopenmpi-dev libhdf5-openmpi-dev hdf5-tools

      - name: Install Python dependencies
        uses: ./.github/actions/install-neuron

      - name: Run tests
        run: uv run tests/cli test --backend neuron --oversubscribe

  test-brian2:
    runs-on: ubuntu-latest
    needs: [lint, download-system]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Restore the test system
        uses: actions/cache/restore@v5
        with:
          path: systems/graphs/EI
          key: ei-system-v1
          fail-on-cache-miss: true

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgsl-dev

      - name: Install dependencies
        run: uv sync --group dev --extra brian2

      - name: Run tests
        run: uv run tests/cli test --backend brian2
        env:
          LIVN_USE_LIBGSL: "1"

  test-neuron-macos:
    runs-on: macos-latest
    needs: [lint, download-system]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Restore the test system
        uses: actions/cache/restore@v5
        with:
          path: systems/graphs/EI
          key: ei-system-v1
          fail-on-cache-miss: true

      - name: Install system dependencies
        run: brew install hdf5-mpi

      - name: Install Python dependencies
        uses: ./.github/actions/install-neuron

      - name: Run tests
        run: uv run tests/cli test --backend neuron --oversubscribe
