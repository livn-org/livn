[project]
name = "livn"
version = "1.0.0"
description = "A testbed for learning to interact with in vitro neural networks"
authors = [
    { name = "Frithjof Gressmann", email = "fg14@illinois.edu" },
    { name = "Ivan Raikov", email = "ivan.g.raikov@gmail.com" },
]
dependencies = [
    "pydantic>=2.11.3",
    "pandas>=2.3.1",
    "gymnasium>=1.2.0",
    "pyfive>=1.1.1",
    "scipy>=1.17.1",
]
readme = "README.md"
requires-python = ">= 3.11"

[project.optional-dependencies]
# backends
neuron = [
    "neuroh5 @ git+https://github.com/iraikov/neuroh5.git@ae0c4b3",
    "mpi4py>=4.0.0",
    "neuron>=9.0.0",
]
diffrax = [
    "jax>=0.10.0; platform_system == 'Darwin'",
    "jax[cuda]>=0.10.0; platform_system != 'Darwin'",
    "equinox>=0.13.7",
    "optimistix>=0.1.0",
    "jaxtyping>=0.3.9",
    "signax>=0.2.1",
    "optax>=0.2.8",
    "lineax>=0.1.0",
    "diffrax>=0.7.2",
]
brian2 = ["cleosim>=0.18.1"]

[project.scripts]
livn = "livn.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-reportlog",
    "ruff>=0.11.5",
    "huggingface-hub>=0.3.1",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.4.0",
    "ty==0.0.74",
]

[tool.uv]
override-dependencies = [
    "jaxtyping>=0.3.9",
    "scipy>=1.17.1",
    "pandas>=2.3.1",
    "numpy>=1.26.2",
    "xarray>=2024.1.0",
]

no-binary-package = ["mpi4py", "h5py"]

[[tool.uv.dependency-metadata]]
name = "neuroh5"
version = "0.1.18"
requires-dist = ["click", "h5py", "mpi4py", "numpy"]

[tool.uv.workspace]
members = ["systems", "benchmarks", "optimization"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/livn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "mpiexec: run this test under mpiexec (see testing/mpiexec.py)",
    "needs(*capabilities): skip unless the backend declares them (livn.types.Capability)",
    "slow: a long reference comparison, deselected by default",
    "traces: the traced path is what this test is about (fast-tier budget exemption)",
]
addopts = "--strict-markers -m 'not slow'"
timeout = 300

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "RET",
    "RUF",
    "PERF",
    "PIE",
]
ignore = [
    "F722",
    "F821",
    "UP037",
]

[tool.ty.src]
include = ["src", "optimization"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.setuptools]
py-modules = []
